<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>نور القرآن — سكينة</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f3e6;--card:#fffaf0;--ink:#1c1b17;--sub:#7a7260;--accent:#0f6b4f;--accent2:#c8a24a;--num:#d32f2f;--line:#e6dcc3;--hl:#fff0b8;--shadow:0 2px 10px rgba(80,60,10,.08)}
:root[data-theme=dark]{--bg:#12161a;--card:#1b2127;--ink:#ece8dc;--sub:#9aa39d;--accent:#3fbf94;--accent2:#d6b25a;--num:#ff6b6b;--line:#2a323a;--hl:#3a3510;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 12px}
.bar h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0;font-size:17px;font-weight:700;text-align:center;color:var(--accent)}
.ib{min-width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.ib:active{transform:scale(.95)}
#home{padding:12px 12px 40px}
#q{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;outline:none}
#q:focus{border-color:var(--accent)}
.resume{margin:12px 0;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#0a4a37);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadow)}
.resume b{font-size:16px}.resume small{opacity:.85;display:block;margin-top:2px}
.resume button{background:#fff;color:#0a4a37;padding:8px 16px;border-radius:10px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media(min-width:520px){.grid{grid-template-columns:1fr 1fr 1fr}}
.s{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:right}
.s:active{background:var(--hl)}
.no{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg);border:1px solid var(--accent2);color:var(--accent);font-weight:700;font-size:13px}
.s .n{font-family:'Amiri Quran',serif;font-size:19px;line-height:1.3}
.s .m{font-size:11px;color:var(--sub)}
.sec{margin:16px 2px 4px;font-size:13px;color:var(--sub);font-weight:600}
#reader{display:none}
.rhead{text-align:center;padding:14px 8px 4px}
.title{font-family:'Amiri Quran',serif;font-size:30px;color:var(--accent);border:2px solid var(--accent2);border-radius:14px;padding:6px 10px;display:inline-block;min-width:60%;background:var(--card)}
.meta{color:var(--sub);font-size:12px;margin-top:6px}
.bism{font-family:'Amiri Quran',serif;text-align:center;font-size:calc(var(--fs)*1.05);margin:14px 0 6px;color:var(--ink)}
#text{padding:8px 16px 30px;font-family:'Amiri Quran','Traditional Arabic',serif;font-size:var(--fs);line-height:2.25;text-align:justify;text-align-last:center;word-spacing:2px}
.v{cursor:pointer;border-radius:6px;transition:background .2s}
.v.on{background:var(--hl)}
.e{color:var(--num);font-size:.78em;white-space:nowrap;margin:0 2px}
.nav{display:flex;gap:8px;padding:0 12px 28px}
.nav button{flex:1;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;color:var(--accent)}
.nav button:disabled{opacity:.35}
#sheet{position:fixed;inset:auto 0 0 0;max-height:62vh;overflow:auto;background:var(--card);border-top:2px solid var(--accent2);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);padding:14px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s;z-index:9}
#sheet.open{transform:none}
#sheet .ar{font-family:'Amiri Quran',serif;font-size:calc(var(--fs)*.95);line-height:2.1;text-align:center}
#sheet .tf{font-size:15px;line-height:1.9;color:var(--ink);margin:8px 0;padding-top:8px;border-top:1px dashed var(--line)}
#sheet .lbl{font-size:12px;color:var(--accent);font-weight:700}
.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1;padding:10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-weight:600;font-size:14px}
.err{padding:30px;text-align:center;color:var(--sub)}
.err button{margin-top:10px;padding:10px 18px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:20}
#toast.on{opacity:.95}
.credit{margin:22px 4px 10px;text-align:center;font-size:11px;color:var(--sub);line-height:1.9}.credit a{color:var(--accent)}
.kh{margin:12px 0;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--accent2)}
.kh b{color:var(--accent)}.kh small{display:block;color:var(--sub);margin-top:2px}
.pb{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0}.pb i{display:block;height:100%;background:var(--accent)}
.kh .row{flex-wrap:wrap}.kh .row button{min-width:30%;padding:9px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-weight:600;font-size:14px}
.kh .row button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
#pl{position:fixed;inset:auto 0 0 0;z-index:8;display:none;background:var(--card);border-top:2px solid var(--accent2);padding:8px 12px calc(8px + env(safe-area-inset-bottom));align-items:center;gap:8px}
#pl.on{display:flex}#pl select{flex:1;min-width:0;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
body.pl{padding-bottom:70px}
.tabs{display:flex;gap:6px;margin:0 0 12px}.tabs button{flex:1;padding:10px 4px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--sub)}.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.note{font-size:12.5px;color:var(--sub);line-height:1.8;margin:6px 2px 10px;text-align:center}
.stb{display:flex;align-items:center;gap:10px;margin:2px 0 10px}.stb b{color:var(--accent);font-size:17px}
.stx{font-family:'Amiri Quran','Traditional Arabic',serif;font-size:var(--fs);line-height:2.25;text-align:justify;padding:8px 6px;margin-top:6px}
.tfd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0}.tfd summary{cursor:pointer;font-weight:700;color:var(--accent)}.tfd p{line-height:1.9;font-size:15px;margin:8px 0}
.stn{margin:8px 0}.stn button,.hc .row button,.srow button{padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;flex:1}.stn button:disabled{opacity:.35}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.chip{padding:7px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.srow{display:flex;gap:8px;margin-bottom:8px}.srow input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;outline:none}
.hc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;box-shadow:var(--shadow)}.hh{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:6px}
.ht{font-family:'Amiri Quran','Traditional Arabic',serif;font-size:calc(var(--fs)*.8);line-height:2.1;text-align:justify}.ht.clamp{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.more{color:var(--accent);font-weight:700;padding:4px 0;font-size:13px}.gr{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:13px;line-height:1.8}
.hc .row{margin-top:8px}.row .pri{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<div id="home">
  <div class="bar" style="margin:-12px -12px 12px"><h1>📗 نور القرآن</h1><button class="ib" id="th" title="الوضع">🌓</button></div>
  <div class="tabs"><button data-tab="s">📖 السور</button><button data-tab="st">📚 القصص</button><button data-tab="h">📜 الأحاديث</button></div>
  <div id="tab-s">
  <input id="q" type="search" inputmode="search" placeholder="ابحث باسم السورة أو رقمها…" autocomplete="off">
  <div id="resume"></div>
  <div id="kh"></div>
  <div id="list"></div>
  </div>
  <div id="tab-st" style="display:none"></div>
  <div id="tab-h" style="display:none"></div>
  <div class="credit" id="mcredit">نص القرآن العثماني من مشروع <a href="https://tanzil.net" target="_blank" rel="noopener">Tanzil</a> (ترخيص CC BY 3.0) عبر <a href="https://alquran.cloud" target="_blank" rel="noopener">alquran.cloud</a><br>التفسير الميسّر (مجمع الملك فهد) عبر alquran.cloud · التلاوات من <a href="https://everyayah.com" target="_blank" rel="noopener">everyayah.com</a><br>سكينة من YMnotes 🤍</div>
</div>
<div id="reader">
  <div class="bar">
    <button class="ib" id="back" aria-label="القائمة">☰</button>
    <h1 id="rt"></h1>
    <button class="ib" id="fm">أ−</button><button class="ib" id="fp">أ+</button><button class="ib" id="th2">🌓</button><button class="ib" id="pls" title="استماع">🎧</button>
  </div>
  <div class="rhead"><div class="title" id="st"></div><div class="meta" id="sm"></div></div>
  <div class="bism" id="bism">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
  <div id="text"></div>
  <div class="nav"><button id="pv">▶ السورة السابقة</button><button id="nx">السورة التالية ◀</button></div>
</div>
<div id="pl"><button class="ib" id="pn">⏮</button><button class="ib" id="pp">⏸</button><button class="ib" id="pf">⏭</button><select id="rc"></select><button class="ib" id="px">✕</button></div>
<div id="sheet"></div>
<div id="toast"></div>
<script>
(()=>{
const tg=window.Telegram&&Telegram.WebApp;
const $=id=>document.getElementById(id);
const AR='٠١٢٣٤٥٦٧٨٩',ar=n=>String(n).replace(/\d/g,d=>AR[d]);
const norm=s=>s.replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/^ال/,'').trim();
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const CS=tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9')?tg.CloudStorage:null;
const cloudSet=(k,v)=>{try{CS&&CS.setItem(k,JSON.stringify(v))}catch{}};
const cloudGet=k=>new Promise(r=>{try{CS?CS.getItem(k,(e,v)=>{try{r(e||!v?null:JSON.parse(v))}catch{r(null)}}):r(null)}catch{r(null)}});
const TOTAL=604;let PAGES=[],KH=LS.get('kh',null);
let IDX=[],cur=null,data=null,fs=LS.get('fs',28),theme=LS.get('theme',null),sel=-1;
const root=document.documentElement;
function applyTheme(){const t=theme||(tg&&tg.colorScheme)||'light';root.dataset.theme=t;try{tg&&tg.setHeaderColor&&tg.setHeaderColor(t==='dark'?'#12161a':'#f8f3e6');tg&&tg.setBackgroundColor&&tg.setBackgroundColor(t==='dark'?'#12161a':'#f8f3e6')}catch{}}
function toggleTheme(){theme=root.dataset.theme==='dark'?'light':'dark';LS.set('theme',theme);applyTheme()}
function setFs(v){fs=Math.max(18,Math.min(54,v));root.style.setProperty('--fs',fs+'px');LS.set('fs',fs)}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1600)}
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw Error(r.status);return r.json()}
const cache={};
async function surah(n){return cache[n]||(cache[n]=await getJSON('data/'+n+'.json'))}
window.NQ={$,ar,norm,getJSON,toast,tg,mods:{},stack:[],IDX:()=>IDX,surah:n=>surah(n),open:(s,a)=>{NQ.stack.length=0;return open(s,a)},fs:()=>fs};
NQ.push=f=>{NQ.stack.push(f);syncBack()};NQ.pop=()=>{const f=NQ.stack.pop();syncBack();f&&f()};
function syncBack(){if(!tg)return;try{(NQ.stack.length||$('reader').style.display==='block')?tg.BackButton.show():tg.BackButton.hide()}catch{}}
let tab=LS.get('tab','s');
function setTab(t){tab=t;LS.set('tab',t);NQ.stack.length=0;syncBack();['s','st','h'].forEach(k=>$('tab-'+k).style.display=k===t?'block':'none');document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));$('mcredit').style.display=t==='s'?'block':'none';if(t!=='s')loadExt(t==='st'?'stories':'hadith')}
function loadExt(n){const m=NQ.mods[n];if(m){m.show();return}const sc=document.createElement('script');sc.src=n+'.js';sc.onload=()=>NQ.mods[n]&&NQ.mods[n].show();sc.onerror=()=>toast('تعذّر التحميل');document.head.appendChild(sc)}

function renderList(f=''){
  const q=norm(f),num=/^\d+$/.test(q)?+q:0;
  const L=IDX.filter(s=>!q||(num?s.n===num:(norm(s.name).includes(q)||s.en.toLowerCase().includes(q.toLowerCase()))));
  $('list').innerHTML=(L.length?'<div class="grid">'+L.map(s=>`<button class="s" data-n="${s.n}"><span class="no">${ar(s.n)}</span><span><div class="n">${s.name}</div><div class="m">${s.r} · ${ar(s.c)} آية</div></span></button>`).join('')+'</div>':'<div class="err">لا توجد نتيجة</div>');
}
function renderResume(){
  const p=LS.get('pos',null);
  $('resume').innerHTML=p&&IDX[p.s-1]?`<div class="resume"><div><b>تابع القراءة</b><small>${IDX[p.s-1].name} · الآية ${ar(p.a)}</small></div><button data-go="${p.s}:${p.a}">متابعة</button></div>`:'';
}
const todayStr=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dayNo=()=>KH?Math.floor((Date.parse(todayStr())-Date.parse(KH.start))/864e5)+1:0;
const rng=d=>[Math.floor((d-1)*TOTAL/KH.days)+1,Math.floor(d*TOTAL/KH.days)];
function saveKh(){LS.set('kh',KH);cloudSet('kh',KH)}
function renderKh(){
  const el=$('kh');
  if(!KH){el.innerHTML='<div class="kh"><b>📅 ختمتي</b><small>اختر مدة ختمة القرآن، وسأحدد لك وردك اليومي بالصفحات (٦٠٤ صفحة)</small><div class="row">'+[7,15,30,60,90].map(n=>`<button data-kh="${n}">${ar(n)} يومًا</button>`).join('')+'</div></div>';return}
  let t=1;while(t<=KH.days&&KH.done.includes(t))t++;
  if(t>KH.days){el.innerHTML='<div class="kh"><b>🎉 ما شاء الله، أتممت الختمة</b><small>تقبّل الله منك. ابدأ ختمة جديدة متى شئت.</small><div class="row"><button class="pri" data-khreset="1">ختمة جديدة</button></div></div>';return}
  const d=Math.min(dayNo(),KH.days),[a,b]=rng(t),late=t<d?d-t:0,pr=PAGES[a-1]||[1,1];
  el.innerHTML=`<div class="kh"><b>📅 ختمتي · اليوم ${ar(t)} من ${ar(KH.days)}</b><small>وردك: الصفحات ${ar(a)} – ${ar(b)}${late?' · متأخر '+ar(late)+' يومًا، لا بأس، أكمل بهدوء':''}</small><div class="pb"><i style="width:${Math.round(KH.done.length/KH.days*100)}%"></i></div><div class="row"><button class="pri" data-go="${pr[0]}:${pr[1]}">افتح وردي</button><button data-khdone="${t}">✅ أتممت وردي</button><button data-khreset="1">تغيير</button></div></div>`;
}
function pageOf(s,a){let lo=0,hi=PAGES.length-1,r=0;const k=s*1000+a;while(lo<=hi){const m=(lo+hi)>>1;if(PAGES[m][0]*1000+PAGES[m][1]<=k){r=m;lo=m+1}else hi=m-1}return r+1}
const RECS=[['Alafasy_128kbps','مشاري العفاسي'],['Husary_128kbps','محمود خليل الحصري'],['Minshawy_Murattal_128kbps','محمد صديق المنشاوي'],['Abdul_Basit_Murattal_192kbps','عبد الباسط عبد الصمد'],['Abdurrahmaan_As-Sudais_192kbps','عبد الرحمن السديس'],['Saood_ash-Shuraym_128kbps','سعود الشريم'],['Hudhaify_128kbps','علي الحذيفي']];
let rec=LS.get('rec',RECS[0][0]);if(!RECS.some(r=>r[0]===rec))rec=RECS[0][0];
const au=new Audio();let playing=-1;au.preload='auto';
const pad=(n,l)=>String(n).padStart(l,'0');
function playAyah(i){if(!data||i<0||i>=data.a.length){stopAudio();return}playing=i;au.src='https://everyayah.com/data/'+rec+'/'+pad(cur,3)+pad(i+1,3)+'.mp3';au.play().catch(()=>toast('تعذّر تشغيل الصوت'));$('pl').classList.add('on');document.body.classList.add('pl');$('pp').textContent='⏸';
  document.querySelectorAll('.v.on').forEach(e=>e.classList.remove('on'));const el=document.querySelector('.v[data-i="'+i+'"]');if(el){el.classList.add('on');el.scrollIntoView({block:'center',behavior:'smooth'})}savePos(cur,i+1)}
function stopAudio(){try{au.pause()}catch{}playing=-1;$('pl').classList.remove('on');document.body.classList.remove('pl');document.querySelectorAll('.v.on').forEach(e=>e.classList.remove('on'))}
au.onended=()=>playAyah(playing+1);au.onerror=()=>toast('تعذّر تحميل التلاوة');
function savePos(s,a){const p={s,a};LS.set('pos',p);cloudSet('pos',p)}

async function open(n,a=0,push=true){
  n=Math.max(1,Math.min(114,n|0));if(cur!==n)stopAudio();
  $('home').style.display='none';$('reader').style.display='block';closeSheet();
  const m=IDX[n-1];cur=n;
  $('rt').textContent=m.name;$('st').textContent='سورة '+m.name;$('sm').textContent=m.r+' · '+ar(m.c)+' آية · رقم '+ar(n);
  $('bism').style.display=(n===1||n===9)?'none':'block';
  $('text').innerHTML='<div class="err">جارٍ التحميل…</div>';
  $('pv').disabled=n===1;$('nx').disabled=n===114;
  try{
    data=await surah(n);
    if(cur!==n)return;
    $('text').innerHTML=data.a.map((t,i)=>`<span class="v" data-i="${i}">${t}<span class="e"> ﴿${ar(i+1)}﴾</span></span>`).join(' ');
    window.scrollTo(0,0);
    if(a>0){const el=document.querySelector(`.v[data-i="${a-1}"]`);if(el){el.scrollIntoView({block:'center'});el.classList.add('on');setTimeout(()=>el.classList.remove('on'),2200)}}
    savePos(n,a>0?a:1);
    if(n<114)surah(n+1).catch(()=>{});
    if(tg){tg.BackButton.show()}
    if(push)history.replaceState(null,'','?s='+n+(a>0?'&a='+a:''));
  }catch{$('text').innerHTML='<div class="err">تعذّر تحميل السورة.<br><button id="rt2">إعادة المحاولة</button></div>';$('rt2').onclick=()=>open(n,a)}
}
function home(){stopAudio();closeSheet();$('reader').style.display='none';$('home').style.display='block';renderResume();renderKh();syncBack();window.scrollTo(0,0);history.replaceState(null,'','./')}

function openSheet(i){
  sel=i;const m=IDX[cur-1];
  document.querySelectorAll('.v.on').forEach(e=>e.classList.remove('on'));
  const el=document.querySelector(`.v[data-i="${i}"]`);el&&el.classList.add('on');
  $('sheet').innerHTML=`<div class="lbl">${m.name} · الآية ${ar(i+1)}${PAGES.length?' · صفحة '+ar(pageOf(cur,i+1)):''}</div><div class="ar">${data.a[i]} ﴿${ar(i+1)}﴾</div><div class="lbl" style="margin-top:6px">التفسير الميسّر</div><div class="tf">${data.t[i]}</div><div class="row"><button id="pa">▶ استماع</button><button id="bm">📌 موضعي</button><button id="cp">📋 نسخ</button><button id="sh">📤 مشاركة</button></div><div class="row"><button id="ap">◀ السابقة</button><button id="an">التالية ▶</button><button id="cl">إغلاق</button></div>`;
  $('sheet').classList.add('open');savePos(cur,i+1);
}
function closeSheet(){$('sheet').classList.remove('open');document.querySelectorAll('.v.on').forEach(e=>e.classList.remove('on'))}
function stepAyah(d){let i=sel+d;if(i<0||i>=data.a.length)return;openSheet(i);document.querySelector(`.v[data-i="${i}"]`).scrollIntoView({block:'center',behavior:'smooth'})}
function ayahText(){const m=IDX[cur-1];return data.a[sel]+' ﴿'+ar(sel+1)+'﴾\n— سورة '+m.name+'\n\nالتفسير الميسّر: '+data.t[sel]}

document.addEventListener('click',async e=>{
  const t=e.target,b=t.closest('button'),v=t.closest('.v');
  if(b&&b.dataset.tab)return setTab(b.dataset.tab);
  if(b&&b.dataset.kh){KH={days:+b.dataset.kh,start:todayStr(),done:[]};saveKh();return renderKh()}
  if(b&&b.dataset.khdone){const t=+b.dataset.khdone;if(!KH.done.includes(t))KH.done.push(t);saveKh();toast('تقبّل الله منك ✅');return renderKh()}
  if(b&&b.dataset.khreset){KH=null;LS.set('kh',null);cloudSet('kh',null);return renderKh()}
  if(b&&b.dataset.n)return open(+b.dataset.n);
  if(b&&b.dataset.go){const [s,a]=b.dataset.go.split(':');return open(+s,+a)}
  if(b){switch(b.id){
    case 'back':return home();
    case 'th':case 'th2':return toggleTheme();
    case 'fp':return setFs(fs+2);
    case 'fm':return setFs(fs-2);
    case 'pv':return open(cur-1);
    case 'nx':return open(cur+1);
    case 'cl':return closeSheet();
    case 'pa':{const i=sel;closeSheet();return playAyah(i)}
    case 'pls':{const p=LS.get('pos',null);return playAyah(p&&p.s===cur?p.a-1:0)}
    case 'pp':if(au.paused){au.play().catch(()=>{});b.textContent='⏸'}else{au.pause();b.textContent='▶'}return;
    case 'pn':return playAyah(playing-1);
    case 'pf':return playAyah(playing+1);
    case 'px':return stopAudio();
    case 'ap':return stepAyah(-1);
    case 'an':return stepAyah(1);
    case 'bm':savePos(cur,sel+1);return toast('تم حفظ موضعك ✅');
    case 'cp':try{await navigator.clipboard.writeText(ayahText());toast('تم النسخ ✅')}catch{toast('تعذّر النسخ')}return;
    case 'sh':{const u='https://t.me/share/url?url='+encodeURIComponent('https://t.me/Sakina_YMnotes_bot')+'&text='+encodeURIComponent(ayahText()+'\n\n🤍 من بوت سكينة');return tg&&tg.openTelegramLink?tg.openTelegramLink(u):window.open(u,'_blank')}
  }}
  if(v&&$('reader').style.display==='block')return openSheet(+v.dataset.i);
  if(!t.closest('#sheet')&&$('sheet').classList.contains('open'))closeSheet();
});
$('q').addEventListener('input',e=>renderList(e.target.value));

(async()=>{
  try{tg&&(tg.ready(),tg.expand(),tg.disableVerticalSwipes&&tg.disableVerticalSwipes(),tg.BackButton.onClick(()=>{if($('sheet').classList.contains('open'))closeSheet();else if($('reader').style.display==='block')home();else if(NQ.stack.length)NQ.pop()}))}catch{}
  applyTheme();setFs(fs);
  try{IDX=await getJSON('data/index.json')}catch{$('list').innerHTML='<div class="err">تعذّر التحميل. تحقق من الاتصال.<br><button onclick="location.reload()">إعادة المحاولة</button></div>';return}
  renderList();
  try{PAGES=await getJSON('data/pages.json')}catch{}
  $('rc').innerHTML=RECS.map(r=>`<option value="${r[0]}"${r[0]===rec?' selected':''}>${r[1]}</option>`).join('');$('rc').onchange=e=>{rec=e.target.value;LS.set('rec',rec);if(playing>=0)playAyah(playing)};
  if(CS){const p=await cloudGet('pos');if(p&&p.s>=1&&p.s<=114&&!LS.get('pos',null))LS.set('pos',p)}
  if(CS&&!KH){const k=await cloudGet('kh');if(k&&k.days&&Array.isArray(k.done)){KH=k;LS.set('kh',k)}}
  renderResume();renderKh();
  const P=new URLSearchParams(location.search),sp=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||'';
  setTab(({quran:'s',stories:'st',hadith:'h'})[P.get('tab')]||tab);
  let s=+P.get('s'),a=+P.get('a')||0;
  const m=/^(\d{1,3})(?:[_:-](\d{1,3}))?$/.exec(sp);if(!s&&m){s=+m[1];a=+m[2]||0}
  if(s>=1&&s<=114)open(s,a,false);
})();
})();
</script>
</body>
</html>
